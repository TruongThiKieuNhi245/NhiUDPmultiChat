spring.application.name=UDPmultiChat
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
chat.data-dir=${CHAT_DATA_DIR:./web-data}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.tomcat.threads.max=32
server.tomcat.max-connections=256
server.tomcat.max-http-form-post-size=16KB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=0
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.springframework=INFO
logging.level.org.apache=INFO
debug=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.security=INFO
